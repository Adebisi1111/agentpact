<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="100,10 190,100 100,190 10,100" fill="none" stroke="url(#g1)" stroke-width="3" filter="url(#glow)"/>
  <line x1="60" y1="60" x2="140" y2="140" stroke="url(#g2)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="140" y1="60" x2="60" y2="140" stroke="url(#g2)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="6" fill="#fff" filter="url(#glow)"/>
  <circle cx="100" cy="10" r="4" fill="#a855f7"/>
  <circle cx="190" cy="100" r="4" fill="#6366f1"/>
  <circle cx="100" cy="190" r="4" fill="#6366f1"/>
  <circle cx="10" cy="100" r="4" fill="#a855f7"/>
</svg>
