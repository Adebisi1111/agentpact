<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgentPact</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--accent:#15BCDF;--bg:#06080f;--surface:#0c1220;--surface2:#131b2e;--text:#d6e4f0;--muted:#7d8ba6;--danger:#ff5c7a;--success:#52e0a1;--yellow:#f59e0b;--radius:10px}
    html{-webkit-text-size-adjust:100%}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    nav{display:flex;align-items:center;gap:1rem;padding:1rem;max-width:1200px;margin:0 auto;flex-wrap:wrap}
    nav .logo{font-weight:700;font-size:1.3rem;color:var(--accent);text-decoration:none;margin-right:auto}
    .badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:700}
    .badge.conn{background:rgba(82,224,161,.15);color:var(--success)}
    .badge.disc{background:rgba(255,92,122,.15);color:var(--danger)}
    .badge.wrong{background:rgba(245,158,11,.15);color:var(--yellow)}
    .btn{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:.5rem 1rem;border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:.85rem}
    .btn:hover{background:var(--accent);color:var(--bg)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-p{background:var(--accent);color:var(--bg)}
    .btn-d{border-color:var(--danger);color:var(--danger)}
    .btn-d:hover{background:var(--danger);color:#fff}
    main{max-width:900px;margin:0 auto;padding:1rem}
    h1{font-size:1.6rem;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{color:var(--muted);margin-bottom:1rem;font-size:.9rem}
    .card{background:var(--surface);border:1px solid rgba(21,188,223,.1);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
    h3{color:var(--accent);margin-bottom:.6rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.6rem}
    .fw{grid-column:1/-1}
    label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:.2rem}
    input{width:100%;background:var(--surface2);border:1px solid rgba(21,188,223,.15);color:var(--text);padding:.5rem;border-radius:var(--radius);font-size:.85rem}
    input:focus{outline:none;border-color:var(--accent)}
    .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
    .out{background:var(--surface2);border-radius:var(--radius);padding:.6rem;margin-top:.6rem;font-family:monospace;font-size:.75rem;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;display:none}
    .out.show{display:block}
    .out.err{color:var(--danger)}
    .out.ok{color:var(--success)}
    .note{border-radius:var(--radius);padding:.6rem;margin-bottom:.8rem;font-size:.85rem;display:none}
    .note.show{display:block}
    .note.err{background:rgba(255,92,122,.1);color:var(--danger)}
    .note.ok{background:rgba(82,224,161,.1);color:var(--success)}
    .note.warn{background:rgba(245,158,11,.1);color:var(--yellow)}
    footer{text-align:center;padding:1rem;color:var(--muted);font-size:.75rem;border-top:1px solid rgba(21,188,223,.05);margin-top:1rem}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav>
    <span class="logo">⚡ AgentPact</span>
    <span id="statusBadge" class="badge disc">Disconnected</span>
    <button id="walletBtn" class="btn">Connect Wallet</button>
  </nav>

  <main>
    <h1>AGENTPACT APP</h1>
    <p class="sub">Trustless service agreements on GenLayer Studio Next</p>

    <div id="note" class="note"></div>

    <div class="card">
      <h3>📝 Create Agreement</h3>
      <div class="grid">
        <div><label>Agreement ID</label><input type="text" id="f_id" value="SA-001"></div>
        <div><label>Worker Address</label><input type="text" id="f_worker" value="0x70997970C51812dc3A010C7d01b50e0d17dc79C8"></div>
        <div class="fw"><label>Terms URL</label><input type="text" id="f_terms" value="https://api.example.com/terms"></div>
        <div><label>Payment/tick (wei)</label><input type="number" id="f_pay" value="1000"></div>
        <div><label>Interval (sec)</label><input type="number" id="f_int" value="3600"></div>
        <div><label>Total ticks</label><input type="number" id="f_ticks" value="10"></div>
        <div><label>Uptime %</label><input type="number" id="f_up" value="95"></div>
        <div><label>Max resp time (ms)</label><input type="number" id="f_resp" value="2000"></div>
        <div><label>Penalty %</label><input type="number" id="f_pen" value="10"></div>
      </div>
      <div class="row">
        <button id="b_create" class="btn btn-p" disabled>Create</button>
        <button id="b_fund" class="btn" disabled>Fund</button>
      </div>
      <div id="o_create" class="out"></div>
    </div>

    <div class="card">
      <h3>✅ Proof / Violations</h3>
      <div class="grid">
        <div><label>Agreement ID</label><input type="text" id="p_id" value="SA-001"></div>
        <div><label>Resp time (ms)</label><input type="number" id="p_resp" value="1500"></div>
      </div>
      <div class="row">
        <button id="b_proof" class="btn btn-p" disabled>Submit Proof</button>
        <button id="b_viol" class="btn btn-d" disabled>Report Violation</button>
        <button id="b_cancel" class="btn btn-d" disabled>Cancel</button>
      </div>
      <div id="o_proof" class="out"></div>
    </div>

    <div class="card">
      <h3>🔍 View Agreement</h3>
      <div class="grid">
        <div class="fw"><label>Agreement ID</label><input type="text" id="v_id" placeholder="e.g., SA-001"></div>
      </div>
      <div class="row"><button id="b_view" class="btn btn-p" disabled>View</button></div>
      <div id="o_view" class="out"></div>
    </div>
  </main>

  <footer>
    <div>© 2026 AgentPact</div>
    <div style="opacity:.6;margin-top:.3rem">0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E</div>
  </footer>
<script src="viem-bundle.js"></script>
<script>
const CONTRACT = '0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E';
const CHAIN = '0x1194D';
const RPC = 'https://studio-next.genlayer.com/api';

let acct = null;
const $ = x => document.getElementById(x);
const note = $('note');

function showNote(m, t) { note.textContent = m; note.className = 'note show ' + t; }
function hideNote() { note.className = 'note'; }
function showOut(id, m, err) { const e = $(id); e.textContent = m; e.className = 'out show ' + (err ? 'err' : 'ok'); }
function setBtn(on) { ['b_create','b_fund','b_proof','b_viol','b_cancel','b_view'].forEach(i => { const b = $(i); if (b) b.disabled = !on; }); }

async function rpc(method, params) {
  const r = await fetch(RPC, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ jsonrpc:'2.0', id: Date.now(), method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'RPC error');
  return j.result;
}

function updateBadge(cls, txt) { const b = $('statusBadge'); b.className = 'badge ' + cls; b.textContent = txt; }

async function connect() {
  if (!window.ethereum) {
    showNote('MetaMask not detected. Open this page in MetaMask browser.', 'err');
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      try { window.location.href = 'https://metamask.app.link/dapp/' + window.location.host + window.location.pathname; } catch(e) {}
    }
    throw new Error('No wallet');
  }
  const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
  if (!accounts || !accounts.length) throw new Error('No accounts');
  acct = accounts[0];
  const chain = await window.ethereum.request({ method: 'eth_chainId' });
  console.log('Current chain:', chain, 'Target:', CHAIN);
  
  if (chain !== CHAIN) {
    showNote('Switching network...', 'warn');
    // First add the chain (in case user doesn't have it)
    try {
      await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 }, blockExplorerUrls: ['https://explorer-studio-dev.genlayer.com/'] }] });
    } catch(addErr) {
      // If chain already exists, that's fine
      console.log('addEthereumChain:', addErr.message);
    }
    // Then switch to it
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN }] });
    } catch(switchErr) {
      console.log('switchEthereumChain:', switchErr.message);
      showNote('⚠️ Please manually switch to GenLayer Studio Next (Chain ID: 61997) in MetaMask', 'err');
      throw new Error('Please switch to GenLayer Studio Next (chain 61997)');
    }
  }
  updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`);
  setBtn(true);
  $('walletBtn').textContent = 'Disconnect';
  return acct;
}

function disconnect() {
  acct = null;
  updateBadge('disc', 'Disconnected');
  setBtn(false);
  $('walletBtn').textContent = 'Connect Wallet';
  hideNote();
}

// ABI for AgentPact
const ABI = [
  { name: 'create_agreement', type: 'function', stateMutability: 'payable', inputs: [
    { name: 'agreement_id', type: 'string' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'total_ticks', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' }
  ], outputs: [{ type: 'string' }] },
  { name: 'fund_agreement', type: 'function', stateMutability: 'payable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'string' }] },
  { name: 'submit_proof', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }, { name: 'proof_hash', type: 'string' }, { name: 'response_time', type: 'uint256' }], outputs: [{ type: 'bool' }] },
  { name: 'report_violation', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'cancel_agreement', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'get_agreement', type: 'function', stateMutability: 'view', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'tuple', components: [
    { name: 'id', type: 'string' }, { name: 'hiree', type: 'address' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'next_deadline', type: 'uint256' },
    { name: 'total_ticks', type: 'uint256' }, { name: 'paid_ticks', type: 'uint256' }, { name: 'status', type: 'string' },
    { name: 'violations', type: 'uint256' }, { name: 'last_proof_hash', type: 'string' }, { name: 'last_check_status', type: 'string' },
    { name: 'last_response_time', type: 'uint256' }, { name: 'consecutive_failures', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' },
    { name: 'total_deposited', type: 'uint256' }, { name: 'total_paid_out', type: 'uint256' }, { name: 'total_refunded', type: 'uint256' }, { name: 'total_penalties', type: 'uint256' }
  ] }] },
  { name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'tuple', components: [{ name: 'total_agreements', type: 'uint256' }, { name: 'total_proofs', type: 'uint256' }] }] }
];

async function sendTx(fn, args, value) {
  const abiItem = ABI.find(f => f.name === fn);
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
  return await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data, value: value ? '0x' + value.toString(16) : '0x0' }] });
}

async function callFn(fn, args) {
  const abiItem = ABI.find(f => f.name === fn);
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
  const result = await rpc('eth_call', [{ to: CONTRACT, data }, 'latest']);
  return window.viem.decodeFunctionResult({ abi: [abiItem], functionName: fn, data: result });
}

// Event listeners
$('walletBtn').addEventListener('click', async () => {
  if (acct) { disconnect(); return; }
  try {
    $('walletBtn').textContent = 'Connecting...';
    $('walletBtn').disabled = true;
    showNote('Connecting...', 'warn');
    await connect();
    showNote('Connected!', 'ok');
    setTimeout(hideNote, 3000);
  } catch (err) {
    showNote('Error: ' + err.message, 'err');
    $('walletBtn').textContent = 'Connect Wallet';
    $('walletBtn').disabled = false;
  }
});

$('b_create').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value;
    const args = [id, $('f_worker').value, $('f_terms').value, BigInt($('f_pay').value), BigInt($('f_int').value), BigInt($('f_ticks').value), BigInt($('f_up').value), BigInt($('f_resp').value), BigInt($('f_pen').value)];
    const val = BigInt($('f_pay').value) * BigInt($('f_ticks').value);
    showOut('o_create', 'Creating...', false);
    const hash = await sendTx('create_agreement', args, val);
    showOut('o_create', '✅ Created!\nTx: ' + hash, false);
    setTimeout(() => viewById(id), 5000);
  } catch (err) { showOut('o_create', 'Error: ' + err.message, true); }
});

$('b_fund').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value;
    const val = BigInt($('f_pay').value) * BigInt($('f_ticks').value);
    showOut('o_create', 'Funding...', false);
    const hash = await sendTx('fund_agreement', [id], val);
    showOut('o_create', '✅ Funded!\nTx: ' + hash, false);
  } catch (err) { showOut('o_create', 'Error: ' + err.message, true); }
});

$('b_proof').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('p_id').value;
    const resp = BigInt($('p_resp').value);
    const hashProof = '0x' + Array.from({length:12}, () => Math.floor(Math.random()*16).toString(16)).join('');
    showOut('o_proof', 'Submitting...', false);
    const hash = await sendTx('submit_proof', [id, hashProof, resp], 0n);
    showOut('o_proof', '✅ Proof submitted!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_viol').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value;
    showOut('o_proof', 'Reporting...', false);
    const hash = await sendTx('report_violation', [id], 0n);
    showOut('o_proof', '✅ Violation reported!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_cancel').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value;
    showOut('o_proof', 'Cancelling...', false);
    const hash = await sendTx('cancel_agreement', [id], 0n);
    showOut('o_proof', '✅ Cancelled!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_view').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('v_id').value;
    showOut('o_view', 'Fetching...', false);
    const result = await callFn('get_agreement', [id]);
    showOut('o_view', '📋 ' + id + '\n' + JSON.stringify(result, (k,v) => typeof v === 'bigint' ? v.toString() : v, 2), false);
  } catch (err) { showOut('o_view', 'Error: ' + err.message, true); }
});

async function viewById(id) {
  $('v_id').value = id;
  if (acct) {
    try { const r = await callFn('get_agreement', [id]); showOut('o_view', '📋 ' + id + '\n' + JSON.stringify(r, (k,v) => typeof v === 'bigint' ? v.toString() : v, 2), false); } catch(e) {}
  }
}

// Listen for changes
if (window.ethereum) {
  window.ethereum.on('accountsChanged', (a) => { if (!a.length) disconnect(); else { acct = a[0]; updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`); setBtn(true); } });
  window.ethereum.on('chainChanged', (c) => { if (c !== CHAIN) { updateBadge('wrong', 'Wrong Network'); setBtn(false); showNote('⚠️ Switch to GenLayer Studio Next (61997)', 'warn'); } else { updateBadge('conn', `✓ ${acct?.slice(0,6)}...${acct?.slice(-4)}`); setBtn(true); hideNote(); } });
}

// Check existing connection
(async () => {
  if (window.ethereum) {
    try {
      const a = await window.ethereum.request({ method: 'eth_accounts' });
      if (a && a.length) {
        acct = a[0];
        const c = await window.ethereum.request({ method: 'eth_chainId' });
        if (c === CHAIN) {
          updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`);
          setBtn(true);
          $('walletBtn').textContent = 'Disconnect';
        } else {
          updateBadge('wrong', 'Wrong Network');
          showNote('⚠️ Switch to GenLayer Studio Next (61997)', 'warn');
        }
      }
    } catch(e) {}
  }
})();
</script>
</body>
</html>
