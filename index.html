<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentPact — Redirecting...</title>
  <meta http-equiv="refresh" content="5;url=https://adebisi1111.github.io/agentpact/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #15BCDF; --bg: #06080f; --surface: #0c1220; --text: #d6e4f0; --muted: #7d8ba6; }
    body { font-family: 'Quantico', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: var(--surface); border: 1px solid rgba(21, 188, 223, 0.15); border-radius: 10px; padding: 2rem; max-width: 600px; text-align: center; }
    h1 { color: var(--accent); margin-bottom: 0.5rem; font-size: 1.8rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { display: inline-block; padding: 0.8rem 1.6rem; background: var(--accent); color: var(--bg); border-radius: 10px; font-weight: 700; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ AgentPact</h1>
    <p>Redirecting to the AgentPact App...</p>
    <p>If not redirected automatically, click below:</p>
    <a href="https://adebisi1111.github.io/agentpact/" class="btn">Go to App</a>
  </div>
</body>
</html>
