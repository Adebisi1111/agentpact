<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentPact</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#15BCDF;--bg:#06080f;--surface:#0c1220;--surface2:#131b2e;--text:#d6e4f0;--muted:#7d8ba6;--danger:#ff5c7a;--success:#52e0a1;--yellow:#f59e0b;--radius:10px}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
    .header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
    .logo{font-size:1.4rem;font-weight:700;color:var(--accent)}
    .badge{padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:700}
    .badge.conn{background:rgba(82,224,161,.15);color:var(--success)}
    .badge.disc{background:rgba(255,92,122,.15);color:var(--danger)}
    .btn{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:.5rem 1rem;border-radius:var(--radius);cursor:pointer;font-weight:700}
    .btn:hover{background:var(--accent);color:var(--bg)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-p{background:var(--accent);color:var(--bg)}
    .btn-d{border-color:var(--danger);color:var(--danger)}
    .card{background:var(--surface);border:1px solid rgba(21,188,223,.1);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
    h3{color:var(--accent);margin-bottom:.5rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
    label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:.1rem}
    input{width:100%;background:var(--surface2);border:1px solid rgba(21,188,223,.15);color:var(--text);padding:.4rem;border-radius:var(--radius);font-size:.85rem}
    .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
    .out{background:var(--surface2);border-radius:var(--radius);padding:.5rem;margin-top:.5rem;font-family:monospace;font-size:.75rem;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;display:none}
    .out.show{display:block}
    .out.err{color:var(--danger)}
    .out.ok{color:var(--success)}
    .note{border-radius:var(--radius);padding:.5rem;margin-bottom:1rem;font-size:.85rem;display:none}
    .note.show{display:block}
    .note.err{background:rgba(255,92,122,.1);color:var(--danger)}
    .note.ok{background:rgba(82,224,161,.1);color:var(--success)}
    .note.warn{background:rgba(245,158,11,.1);color:var(--yellow)}
    footer{margin-top:1rem;padding:1rem;border-top:1px solid rgba(21,188,223,.05);text-align:center;color:var(--muted);font-size:.75rem}
  </style>
</head>
<body>
<div class="header">
  <span class="logo">⚡ AgentPact</span>
  <span id="badge" class="badge disc">Disconnected</span>
  <button id="walletBtn" class="btn">Connect Wallet</button>
</div>

<div id="note" class="note"></div>

<div class="card">
  <h3>📝 Create Agreement</h3>
  <div class="grid">
    <div><label>Agreement ID</label><input type="text" id="f_id" placeholder="SA-001"></div>
    <div><label>Worker Address</label><input type="text" id="f_worker" placeholder="0x..."></div>
    <div style="grid-column:1/-1"><label>Terms URL</label><input type="text" id="f_terms" placeholder="https://..."></div>
    <div><label>Payment/tick (wei)</label><input type="number" id="f_pay" placeholder="1000"></div>
    <div><label>Interval (sec)</label><input type="number" id="f_int" placeholder="3600"></div>
    <div><label>Total ticks</label><input type="number" id="f_ticks" placeholder="10"></div>
    <div><label>Uptime %</label><input type="number" id="f_up" placeholder="95"></div>
    <div><label>Max resp time (ms)</label><input type="number" id="f_resp" placeholder="2000"></div>
    <div><label>Penalty %</label><input type="number" id="f_pen" placeholder="10"></div>
  </div>
  <div class="row">
    <button id="b_create" class="btn btn-p" disabled>Create</button>
    <button id="b_fund" class="btn" disabled>Fund</button>
  </div>
  <div id="o_create" class="out"></div>
</div>

<div class="card">
  <h3>✅ Proof / Violations</h3>
  <div class="grid">
    <div><label>Agreement ID</label><input type="text" id="p_id" placeholder="SA-001"></div>
    <div><label>Resp time (ms)</label><input type="number" id="p_resp" placeholder="1500"></div>
  </div>
  <div class="row">
    <button id="b_proof" class="btn btn-p" disabled>Submit Proof</button>
    <button id="b_viol" class="btn btn-d" disabled>Report Violation</button>
    <button id="b_cancel" class="btn btn-d" disabled>Cancel</button>
  </div>
  <div id="o_proof" class="out"></div>
</div>

<div class="card">
  <h3>🔍 View Agreement</h3>
  <div class="grid">
    <div style="grid-column:1/-1"><label>Agreement ID</label><input type="text" id="v_id" placeholder="e.g., SA-001"></div>
  </div>
  <div class="row"><button id="b_view" class="btn btn-p" disabled>View</button></div>
  <div id="o_view" class="out"></div>
</div>

<footer>© 2026 AgentPact — 0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E</footer>

<script src="viem-iife.js"></script>
<script>
const CONTRACT = '0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E';
const CHAIN = '0xf22d';
const RPC = 'https://studio-next.genlayer.com/api';

let acct = null;
const $ = x => document.getElementById(x);
const note = $('note');

function showNote(m, t) { note.textContent = m; note.className = 'note show ' + t; }
function hideNote() { note.className = 'note'; }
function showOut(id, m, err) { const e = $(id); e.textContent = m; e.className = 'out show' + (err ? ' err' : ' ok'); }
function setBtn(on) { ['b_create','b_fund','b_proof','b_viol','b_cancel','b_view'].forEach(i => { const b = $(i); if (b) b.disabled = !on; }); }
function updateBadge(cls, txt) { const b = $('badge'); b.className = 'badge ' + cls; b.textContent = txt; }

async function rpc(method, params) {
  const r = await fetch(RPC, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ jsonrpc:'2.0', id: Date.now(), method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'RPC error');
  return j.result;
}

async function connect() {
  if (!window.ethereum) {
    showNote('MetaMask not detected.', 'err');
    throw new Error('No wallet');
  }
  if (!window.viem) {
    showNote('Wallet library not loaded. Please refresh.', 'err');
    throw new Error('viem not loaded');
  }
  const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
  if (!accounts || !accounts.length) throw new Error('No accounts');
  acct = accounts[0];
  const chain = await window.ethereum.request({ method: 'eth_chainId' });
  const chainDec = typeof chain === 'number' ? chain : parseInt(chain, 16);
  const targetDec = parseInt(CHAIN, 16);
  
  if (chainDec !== targetDec) {
    showNote('Switching to GenLayer Studio Next...', 'warn');
    try {
      await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] });
    } catch(e) {}
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN }] });
  }
  updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`);
  setBtn(true);
  $('walletBtn').textContent = 'Disconnect';
  hideNote();
  return acct;
}

function disconnect() {
  acct = null;
  updateBadge('disc', 'Disconnected');
  setBtn(false);
  $('walletBtn').textContent = 'Connect Wallet';
  hideNote();
}

async function sendTx(fn, args, value) {
  const abiItem = ABI.find(f => f.name === fn);
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
  return await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data, value: value ? '0x' + value.toString(16) : '0x0' }] });
}

async function callFn(fn, args) {
  const abiItem = ABI.find(f => f.name === fn);
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
  const result = await rpc('eth_call', [{ to: CONTRACT, data }, 'latest']);
  if (!result || result === '0x' || result.length <= 2) return null;
  if (fn === 'get_agreement') return parseGetAgreement(result);
  try { return window.viem.decodeFunctionResult({ abi: [abiItem], functionName: fn, data: result }); }
  catch(e) { return result; }
}

function parseGetAgreement(hex) {
  const h = hex.slice(2);
  const fields = [];
  let pos = 0;
  const readUint = () => { const v = parseInt(h.slice(pos, pos + 64), 16); pos += 64; return v; };
  const readAddr = () => { const v = '0x' + h.slice(pos + 24, pos + 64); pos += 64; return v; };
  const readStringAt = (offset) => { const abs = offset * 2; const len = parseInt(h.slice(abs, abs + 64), 16); return h.slice(abs + 64, abs + 64 + len * 2).match(/.{2}/g).map(b => String.fromCharCode(parseInt(b, 16))).join(''); };
  pos = 64;
  const idOff = readUint(); fields.push(readStringAt(idOff));
  fields.push(readAddr());
  fields.push(readAddr());
  const termsOff = readUint(); fields.push(readStringAt(termsOff));
  fields.push(readUint()); fields.push(readUint()); fields.push(readUint());
  fields.push(readUint()); fields.push(readUint());
  const statusOff = readUint(); fields.push(readStringAt(statusOff));
  fields.push(readUint());
  const proofHashOff = readUint(); fields.push(readStringAt(proofHashOff));
  const checkStatusOff = readUint(); fields.push(readStringAt(checkStatusOff));
  fields.push(readUint()); fields.push(readUint()); fields.push(readUint());
  fields.push(readUint()); fields.push(readUint()); fields.push(readUint());
  fields.push(readUint()); fields.push(readUint()); fields.push(readUint());
  const keys = ['id', 'hiree', 'worker', 'terms', 'payment_per_tick', 'interval_seconds',
    'next_deadline', 'total_ticks', 'paid_ticks', 'status', 'violations',
    'last_proof_hash', 'last_check_status', 'last_response_time', 'consecutive_failures',
    'uptime_required', 'response_time_required', 'penalty_rate', 'total_deposited',
    'total_paid_out', 'total_refunded', 'total_penalties'];
  const obj = {};
  keys.forEach((k, i) => { obj[k] = fields[i]; });
  return obj;
}

const ABI = [
  { name: 'create_agreement', type: 'function', stateMutability: 'payable', inputs: [
    { name: 'agreement_id', type: 'string' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'total_ticks', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' }
  ], outputs: [{ type: 'string' }] },
  { name: 'fund_agreement', type: 'function', stateMutability: 'payable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'string' }] },
  { name: 'submit_proof', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }, { name: 'proof_hash', type: 'string' }, { name: 'response_time', type: 'uint256' }], outputs: [{ type: 'bool' }] },
  { name: 'report_violation', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'cancel_agreement', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'get_agreement', type: 'function', stateMutability: 'view', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'tuple', components: [
    { name: 'id', type: 'string' }, { name: 'hiree', type: 'address' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'next_deadline', type: 'uint256' },
    { name: 'total_ticks', type: 'uint256' }, { name: 'paid_ticks', type: 'uint256' }, { name: 'status', type: 'string' },
    { name: 'violations', type: 'uint256' }, { name: 'last_proof_hash', type: 'string' }, { name: 'last_check_status', type: 'string' },
    { name: 'last_response_time', type: 'uint256' }, { name: 'consecutive_failures', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' },
    { name: 'total_deposited', type: 'uint256' }, { name: 'total_paid_out', type: 'uint256' }, { name: 'total_refunded', type: 'uint256' }, { name: 'total_penalties', type: 'uint256' }
  ] }] },
  { name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'tuple', components: [{ name: 'total_agreements', type: 'uint256' }, { name: 'total_proofs', type: 'uint256' }] }] }
];

$('walletBtn').addEventListener('click', async () => {
  if (acct) { disconnect(); return; }
  try {
    $('walletBtn').textContent = 'Connecting...';
    $('walletBtn').disabled = true;
    showNote('Connecting...', 'warn');
    await connect();
  } catch (err) {
    showNote('Error: ' + err.message, 'err');
    $('walletBtn').textContent = 'Connect Wallet';
    $('walletBtn').disabled = false;
  }
});

$('b_create').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value || $('f_id').placeholder;
    const worker = $('f_worker').value || $('f_worker').placeholder;
    const terms = $('f_terms').value || $('f_terms').placeholder;
    const pay = BigInt($('f_pay').value || $('f_pay').placeholder);
    const interval = BigInt($('f_int').value || $('f_int').placeholder);
    const total = BigInt($('f_ticks').value || $('f_ticks').placeholder);
    const uptime = BigInt($('f_up').value || $('f_up').placeholder);
    const respTime = BigInt($('f_resp').value || $('f_resp').placeholder);
    const penalty = BigInt($('f_pen').value || $('f_pen').placeholder);
    const val = pay * total;
    showOut('o_create', 'Creating...', false);
    const hash = await sendTx('create_agreement', [id, worker, terms, pay, interval, total, uptime, respTime, penalty], val);
    showOut('o_create', '✅ Created!\nTx: ' + hash, false);
  } catch (err) { showOut('o_create', 'Error: ' + err.message, true); }
});

$('b_fund').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value || $('f_id').placeholder;
    const val = BigInt($('f_pay').value || $('f_pay').placeholder) * BigInt($('f_ticks').value || $('f_ticks').placeholder);
    showOut('o_create', 'Funding...', false);
    const hash = await sendTx('fund_agreement', [id], val);
    showOut('o_create', '✅ Funded!\nTx: ' + hash, false);
  } catch (err) { showOut('o_create', 'Error: ' + err.message, true); }
});

$('b_proof').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('p_id').value || $('p_id').placeholder;
    const resp = BigInt($('p_resp').value || $('p_resp').placeholder);
    const proofHash = '0x' + Array.from({length:12}, () => Math.floor(Math.random()*16).toString(16)).join('');
    showOut('o_proof', 'Submitting...', false);
    const hash = await sendTx('submit_proof', [id, proofHash, resp], 0n);
    showOut('o_proof', '✅ Proof submitted!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_viol').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value || $('f_id').placeholder;
    showOut('o_proof', 'Reporting...', false);
    const hash = await sendTx('report_violation', [id], 0n);
    showOut('o_proof', '✅ Violation reported!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_cancel').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('f_id').value || $('f_id').placeholder;
    showOut('o_proof', 'Cancelling...', false);
    const hash = await sendTx('cancel_agreement', [id], 0n);
    showOut('o_proof', '✅ Cancelled!\nTx: ' + hash, false);
  } catch (err) { showOut('o_proof', 'Error: ' + err.message, true); }
});

$('b_view').addEventListener('click', async () => {
  try {
    hideNote();
    const id = $('v_id').value || $('v_id').placeholder;
    if (!id || id === 'e.g., SA-001') {
      showNote('Please enter an agreement ID', 'warn');
      return;
    }
    showOut('o_view', 'Fetching...', false);
    const result = await callFn('get_agreement', [id]);
    if (!result) {
      showOut('o_view', 'Agreement "' + id + '" does not exist.\n\nCreate and fund it first.', true);
      return;
    }
    showOut('o_view', '📋 Agreement: ' + id + '\n\n' + JSON.stringify(result, (k,v) => typeof v === 'bigint' ? v.toString() : v, 2), false);
  } catch (err) { showOut('o_view', 'Error: ' + err.message, true); }
});

if (window.ethereum) {
  window.ethereum.on('accountsChanged', (a) => { if (!a.length) disconnect(); else { acct = a[0]; updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`); setBtn(true); } });
  window.ethereum.on('chainChanged', (c) => { if (c !== CHAIN) { updateBadge('disc', 'Wrong Network'); setBtn(false); showNote('⚠️ Switch to GenLayer Studio Next', 'warn'); } });
}

(async () => {
  if (window.ethereum) {
    try {
      const a = await window.ethereum.request({ method: 'eth_accounts' });
      if (a && a.length) {
        acct = a[0];
        const c = await window.ethereum.request({ method: 'eth_chainId' });
        if (c === CHAIN) {
          updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`);
          setBtn(true);
          $('walletBtn').textContent = 'Disconnect';
        }
      }
    } catch(e) {}
  }
})();
</script>
</body>
</html>
