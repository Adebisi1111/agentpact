<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgentPact</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
  <script src="viem.bundle.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--accent:#15BCDF;--accent-glow:rgba(21,188,223,.35);--bg:#06080f;--surface:#0c1220;--surface2:#131b2e;--text:#d6e4f0;--muted:#7d8ba6;--danger:#ff5c7a;--success:#52e0a1;--yellow:#f59e0b;--radius:10px}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    nav{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;max-width:1200px;margin:0 auto;flex-wrap:wrap}
    nav .logo{font-weight:700;font-size:1.3rem;color:var(--accent);text-decoration:none;margin-right:auto;white-space:nowrap}
    .status-badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap}
    .status-badge.connected{background:rgba(82,224,161,.15);color:var(--success)}
    .status-badge.disconnected{background:rgba(255,92,122,.15);color:var(--danger)}
    .status-badge.wrong-network{background:rgba(245,158,11,.15);color:var(--yellow)}
    .btn{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:.5rem 1.2rem;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;transition:all .2s;white-space:nowrap}
    .btn:hover{background:var(--accent);color:var(--bg)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn:disabled:hover{background:transparent;color:var(--accent)}
    .btn-primary{background:var(--accent);color:var(--bg)}
    .btn-primary:hover{background:#0e9bbf;border-color:#0e9bbf}
    .btn-primary:disabled:hover{background:var(--accent)}
    .btn-danger{border-color:var(--danger);color:var(--danger)}
    .btn-danger:hover{background:var(--danger);color:#fff}
    main{max-width:900px;margin:0 auto;padding:1rem 1.5rem}
    h1{font-size:1.8rem;margin-bottom:.3rem;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .subtitle{color:var(--muted);margin-bottom:1.5rem;font-size:.95rem}
    .card{background:var(--surface);border:1px solid rgba(21,188,223,.12);border-radius:var(--radius);padding:1.2rem;margin-bottom:1.2rem}
    h3{color:var(--accent);margin-bottom:.8rem;font-size:1.05rem}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
    .form-grid .full-width{grid-column:1/-1}
    .form-group{display:flex;flex-direction:column;gap:.3rem}
    label{font-size:.78rem;color:var(--muted);font-weight:700}
    input{background:var(--surface2);border:1px solid rgba(21,188,223,.15);color:var(--text);padding:.6rem .8rem;border-radius:var(--radius);font-family:inherit;font-size:.85rem;-webkit-appearance:none;appearance:none}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
    .btn-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.5rem}
    .output{background:var(--surface2);border-radius:var(--radius);padding:.8rem;margin-top:.8rem;font-family:'Courier New',Courier,monospace;font-size:.78rem;white-space:pre-wrap;word-break:break-all;max-height:250px;overflow-y:auto;display:none;line-height:1.5}
    .output.show{display:block}
    .output.error{color:var(--danger);border:1px solid rgba(255,92,122,.3)}
    .output.success{color:var(--success);border:1px solid rgba(82,224,161,.3)}
    .banner{border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:1rem;font-size:.85rem;display:none}
    .banner.show{display:block}
    .banner.error{background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.3);color:var(--danger)}
    .banner.success{background:rgba(82,224,161,.1);border:1px solid rgba(82,224,161,.3);color:var(--success)}
    .banner.warning{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
    footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.78rem;border-top:1px solid rgba(21,188,223,.08);margin-top:2rem}
    .loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:.4rem;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr}nav{gap:.6rem;padding:.8rem 1rem}nav .logo{font-size:1.1rem}main{padding:.8rem 1rem}h1{font-size:1.5rem}}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">⚡ AgentPact</a>
    <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
    <button id="walletBtn" class="btn">Connect Wallet</button>
  </nav>

  <main>
    <h1>AGENTPACT APP</h1>
    <p class="subtitle">Trustless service agreements on GenLayer Studio Next</p>

    <div id="banner" class="banner"></div>

    <div class="card">
      <h3>📝 Create Agreement</h3>
      <div class="form-grid">
        <div class="form-group"><label>Agreement ID</label><input type="text" id="agreementId" value="SA-001" placeholder="e.g., SA-001"></div>
        <div class="form-group"><label>Worker Address (0x...)</label><input type="text" id="workerAddress" value="0x70997970C51812dc3A010C7d01b50e0d17dc79C8" placeholder="0x..."></div>
        <div class="form-group full-width"><label>Terms URL</label><input type="text" id="termsUrl" value="https://api.example.com/terms" placeholder="https://..."></div>
        <div class="form-group"><label>Payment per tick (wei)</label><input type="number" id="paymentPerTick" value="1000"></div>
        <div class="form-group"><label>Interval (seconds)</label><input type="number" id="intervalSeconds" value="3600"></div>
        <div class="form-group"><label>Total ticks</label><input type="number" id="totalTicks" value="10"></div>
        <div class="form-group"><label>Uptime required (%)</label><input type="number" id="uptimeRequired" value="95"></div>
        <div class="form-group"><label>Max response time (ms)</label><input type="number" id="responseTimeRequired" value="2000"></div>
        <div class="form-group"><label>Penalty rate (%)</label><input type="number" id="penaltyRate" value="10"></div>
      </div>
      <div class="btn-row">
        <button id="createBtn" class="btn btn-primary" disabled>Create Agreement</button>
        <button id="fundBtn" class="btn" disabled>Fund Agreement</button>
      </div>
      <div id="createOutput" class="output"></div>
    </div>

    <div class="card">
      <h3>✅ Submit Proof / Report</h3>
      <div class="form-grid">
        <div class="form-group"><label>Agreement ID</label><input type="text" id="proofAgreementId" value="SA-001" placeholder="e.g., SA-001"></div>
        <div class="form-group"><label>Response time (ms)</label><input type="number" id="proofResponseTime" value="1500"></div>
      </div>
      <div class="btn-row">
        <button id="proofBtn" class="btn btn-primary" disabled>Submit Proof</button>
        <button id="violationBtn" class="btn btn-danger" disabled>Report Violation</button>
        <button id="cancelBtn" class="btn btn-danger" disabled>Cancel Agreement</button>
      </div>
      <div id="proofOutput" class="output"></div>
    </div>

    <div class="card">
      <h3>🔍 View Agreement</h3>
      <div class="form-grid">
        <div class="form-group full-width"><label>Agreement ID</label><input type="text" id="viewAgreementId" placeholder="e.g., SA-001"></div>
      </div>
      <div class="btn-row"><button id="viewBtn" class="btn btn-primary" disabled>View</button></div>
      <div id="viewOutput" class="output"></div>
    </div>
  </main>

  <footer>
    <div>© 2026 AgentPact — Built on GenLayer</div>
    <div style="margin-top:.5rem;opacity:.7">Contract: 0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E</div>
  </footer>

<script>
const CONTRACT = '0x9bC45B33FCaa6CEdFE4edA477EB10A4F31Ddee9E';
const CHAIN_ID = '0x1194D';
const CHAIN_ID_DEC = 61997;
const RPC_URL = 'https://studio-next.genlayer.com/api';
const EXPLORER = 'https://explorer-studio-dev.genlayer.com';

const chain = {
  id: CHAIN_ID_DEC,
  name: 'Studio Next',
  rpcUrls: { default: { http: [RPC_URL] } },
  blockExplorers: { default: { url: EXPLORER, name: 'Explorer' } },
  nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
  testnet: true,
};

let account = null;
let publicClient = null;

const $ = id => document.getElementById(id);
const banner = $('banner');

function showBanner(msg, type) { banner.textContent = msg; banner.className = 'banner show ' + type; }
function hideBanner() { banner.className = 'banner'; }
function showOutput(id, msg, isError) { const el = $(id); el.textContent = msg; el.className = 'output show ' + (isError ? 'error' : 'success'); }

function updateStatus(status, text) { const badge = $('statusBadge'); badge.className = 'status-badge ' + status; badge.textContent = text; }

function setButtonsEnabled(enabled) {
  ['createBtn','fundBtn','proofBtn','violationBtn','cancelBtn','viewBtn'].forEach(id => { const b = $(id); if (b) b.disabled = !enabled; });
}

async function connectWallet() {
  if (!window.ethereum) {
    // Show install prompt
    showBanner('MetaMask not detected. Please install MetaMask or open this page in MetaMask browser.', 'error');
    // Try to deep link to MetaMask if on mobile
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = 'https://metamask.app.link/dapp/adebisi1111.github.io/agentpact/';
    }
    throw new Error('No wallet detected. Install MetaMask or open in MetaMask browser.');
  }
  const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
  if (!accounts || accounts.length === 0) throw new Error('No accounts found');
  account = accounts[0];
  const chainId = await window.ethereum.request({ method: 'eth_chainId' });
  if (chainId !== CHAIN_ID) {
    try {
      await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN_ID, chainName: 'GenLayer Studio Next', rpcUrls: [RPC_URL], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 }, blockExplorerUrls: [EXPLORER + '/'] }] });
    } catch (e) {}
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });
  }
  publicClient = window.viem.createPublicClient({ chain, transport: window.viem.http(RPC_URL) });
  updateStatus('connected', `✓ ${account.slice(0,6)}...${account.slice(-4)}`);
  setButtonsEnabled(true);
  $('walletBtn').textContent = 'Disconnect';
  return account;
}

function disconnectWallet() {
  account = null; publicClient = null;
  updateStatus('disconnected', 'Disconnected');
  setButtonsEnabled(false);
  $('walletBtn').textContent = 'Connect Wallet';
  hideBanner();
}

// ABI for AgentPact contract
const AGENTPACT_ABI = [
  { name: 'create_agreement', type: 'function', stateMutability: 'payable', inputs: [
    { name: 'agreement_id', type: 'string' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'total_ticks', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' }
  ], outputs: [{ type: 'string' }] },
  { name: 'fund_agreement', type: 'function', stateMutability: 'payable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'string' }] },
  { name: 'submit_proof', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }, { name: 'proof_hash', type: 'string' }, { name: 'response_time', type: 'uint256' }], outputs: [{ type: 'bool' }] },
  { name: 'report_violation', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'cancel_agreement', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'bool' }] },
  { name: 'get_agreement', type: 'function', stateMutability: 'view', inputs: [{ name: 'agreement_id', type: 'string' }], outputs: [{ type: 'tuple', components: [
    { name: 'id', type: 'string' }, { name: 'hiree', type: 'address' }, { name: 'worker', type: 'address' }, { name: 'terms', type: 'string' },
    { name: 'payment_per_tick', type: 'uint256' }, { name: 'interval_seconds', type: 'uint256' }, { name: 'next_deadline', type: 'uint256' },
    { name: 'total_ticks', type: 'uint256' }, { name: 'paid_ticks', type: 'uint256' }, { name: 'status', type: 'string' },
    { name: 'violations', type: 'uint256' }, { name: 'last_proof_hash', type: 'string' }, { name: 'last_check_status', type: 'string' },
    { name: 'last_response_time', type: 'uint256' }, { name: 'consecutive_failures', type: 'uint256' },
    { name: 'uptime_required', type: 'uint256' }, { name: 'response_time_required', type: 'uint256' }, { name: 'penalty_rate', type: 'uint256' },
    { name: 'total_deposited', type: 'uint256' }, { name: 'total_paid_out', type: 'uint256' }, { name: 'total_refunded', type: 'uint256' }, { name: 'total_penalties', type: 'uint256' }
  ] }] },
  { name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'tuple', components: [{ name: 'total_agreements', type: 'uint256' }, { name: 'total_proofs', type: 'uint256' }] }] }
];

async function writeContract(functionName, args, value) {
  const abiItem = AGENTPACT_ABI.find(f => f.name === functionName);
  if (!abiItem) throw new Error('Unknown function: ' + functionName);
  
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName, args });
  
  const hash = await window.ethereum.request({
    method: 'eth_sendTransaction',
    params: [{ from: account, to: CONTRACT, data, value: value ? '0x' + value.toString(16) : '0x0' }]
  });
  
  return hash;
}

async function readContract(functionName, args) {
  const abiItem = AGENTPACT_ABI.find(f => f.name === functionName);
  if (!abiItem) throw new Error('Unknown function: ' + functionName);
  
  const data = window.viem.encodeFunctionData({ abi: [abiItem], functionName, args });
  
  const result = await window.ethereum.request({
    method: 'eth_call',
    params: [{ to: CONTRACT, data }, 'latest']
  });
  
  const decoded = window.viem.decodeFunctionResult({ abi: [abiItem], functionName, data: result });
  return decoded;
}

// Event listeners
$('walletBtn').addEventListener('click', async () => {
  if (account) { disconnectWallet(); return; }
  try {
    $('walletBtn').textContent = 'Connecting...';
    $('walletBtn').disabled = true;
    showBanner('Connecting wallet...', 'warning');
    console.log('window.ethereum:', !!window.ethereum);
    console.log('window.viem:', !!window.viem);
    await connectWallet();
    showBanner('Wallet connected!', 'success');
    setTimeout(hideBanner, 3000);
  } catch (err) {
    console.error('Wallet connection error:', err);
    showBanner('Error: ' + err.message, 'error');
    $('walletBtn').textContent = 'Connect Wallet';
    $('walletBtn').disabled = false;
  }
});

$('createBtn').addEventListener('click', async () => {
  const btn = $('createBtn');
  try {
    btn.textContent = 'Creating...'; btn.disabled = true;
    hideBanner();
    const id = $('agreementId').value;
    const worker = $('workerAddress').value;
    const terms = $('termsUrl').value;
    const pay = BigInt($('paymentPerTick').value);
    const interval = BigInt($('intervalSeconds').value);
    const total = BigInt($('totalTicks').value);
    const uptime = BigInt($('uptimeRequired').value);
    const responseTime = BigInt($('responseTimeRequired').value);
    const penalty = BigInt($('penaltyRate').value);
    const totalEscrow = pay * total;
    showOutput('createOutput', 'Creating agreement...', false);
    const hash = await writeContract('create_agreement', [id, worker, terms, pay, interval, total, uptime, responseTime, penalty], totalEscrow);
    showOutput('createOutput', '✅ Created!\nTx: ' + hash + '\n\nWaiting for finalization...', false);
    showBanner('Agreement created!', 'success');
    setTimeout(() => viewAgreementById(id), 5000);
  } catch (err) {
    showOutput('createOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'Create Agreement'; btn.disabled = false;
  }
});

$('fundBtn').addEventListener('click', async () => {
  const btn = $('fundBtn');
  try {
    btn.textContent = 'Funding...'; btn.disabled = true;
    hideBanner();
    const id = $('agreementId').value;
    const pay = BigInt($('paymentPerTick').value);
    const total = BigInt($('totalTicks').value);
    showOutput('createOutput', 'Funding agreement...', false);
    const hash = await writeContract('fund_agreement', [id], pay * total);
    showOutput('createOutput', '✅ Funded!\nTx: ' + hash, false);
    showBanner('Agreement funded!', 'success');
  } catch (err) {
    showOutput('createOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'Fund Agreement'; btn.disabled = false;
  }
});

$('proofBtn').addEventListener('click', async () => {
  const btn = $('proofBtn');
  try {
    btn.textContent = 'Submitting...'; btn.disabled = true;
    hideBanner();
    const id = $('proofAgreementId').value;
    const responseTime = BigInt($('proofResponseTime').value);
    const proofHash = '0x' + Array.from({length: 12}, () => Math.floor(Math.random() * 16).toString(16)).join('');
    showOutput('proofOutput', 'Submitting proof...', false);
    const hash = await writeContract('submit_proof', [id, proofHash, responseTime], 0n);
    showOutput('proofOutput', '✅ Proof submitted!\nTx: ' + hash, false);
    showBanner('Proof submitted!', 'success');
  } catch (err) {
    showOutput('proofOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'Submit Proof'; btn.disabled = false;
  }
});

$('violationBtn').addEventListener('click', async () => {
  const btn = $('violationBtn');
  try {
    btn.textContent = 'Reporting...'; btn.disabled = true;
    hideBanner();
    const id = $('agreementId').value;
    showOutput('proofOutput', 'Reporting violation...', false);
    const hash = await writeContract('report_violation', [id], 0n);
    showOutput('proofOutput', '✅ Violation reported!\nTx: ' + hash, false);
    showBanner('Violation reported!', 'success');
  } catch (err) {
    showOutput('proofOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'Report Violation'; btn.disabled = false;
  }
});

$('cancelBtn').addEventListener('click', async () => {
  const btn = $('cancelBtn');
  try {
    btn.textContent = 'Cancelling...'; btn.disabled = true;
    hideBanner();
    const id = $('agreementId').value;
    showOutput('proofOutput', 'Cancelling agreement...', false);
    const hash = await writeContract('cancel_agreement', [id], 0n);
    showOutput('proofOutput', '✅ Cancelled!\nTx: ' + hash, false);
    showBanner('Agreement cancelled!', 'success');
  } catch (err) {
    showOutput('proofOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'Cancel Agreement'; btn.disabled = false;
  }
});

$('viewBtn').addEventListener('click', async () => {
  const btn = $('viewBtn');
  try {
    btn.textContent = 'Loading...'; btn.disabled = true;
    hideBanner();
    const id = $('viewAgreementId').value;
    showOutput('viewOutput', 'Fetching agreement...', false);
    const result = await readContract('get_agreement', [id]);
    if (result) {
      showOutput('viewOutput', '📋 Agreement: ' + id + '\n\n' + JSON.stringify(result, (k, v) => typeof v === 'bigint' ? v.toString() : v, 2), false);
    } else {
      showOutput('viewOutput', 'Agreement not found: ' + id, true);
    }
  } catch (err) {
    showOutput('viewOutput', 'Error: ' + err.message, true);
    showBanner('Error: ' + err.message, 'error');
  } finally {
    btn.textContent = 'View'; btn.disabled = false;
  }
});

async function viewAgreementById(id) {
  $('viewAgreementId').value = id;
  if (account) {
    try {
      const result = await readContract('get_agreement', [id]);
      if (result) showOutput('viewOutput', '📋 Agreement: ' + id + '\n\n' + JSON.stringify(result, (k, v) => typeof v === 'bigint' ? v.toString() : v, 2), false);
    } catch (err) {}
  }
}

// Listen for account/chain changes
if (window.ethereum) {
  window.ethereum.on('accountsChanged', async (accounts) => {
    if (accounts.length === 0) { disconnectWallet(); }
    else {
      account = accounts[0];
      updateStatus('connected', `✓ ${account.slice(0,6)}...${account.slice(-4)}`);
      setButtonsEnabled(true);
    }
  });
  window.ethereum.on('chainChanged', async (chainId) => {
    if (chainId !== CHAIN_ID) {
      updateStatus('wrong-network', 'Wrong Network');
      setButtonsEnabled(false);
      showBanner('⚠️ Please switch to GenLayer Studio Next (chain 61997)', 'warning');
    } else {
      updateStatus('connected', `✓ ${account?.slice(0,6)}...${account?.slice(-4)}`);
      setButtonsEnabled(true);
      hideBanner();
    }
  });
}

// Check if already connected
(async () => {
  // Verify viem loaded
  if (!window.viem) {
    showBanner('⚠️ Failed to load wallet library. Please refresh the page.', 'error');
    return;
  }
  
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_accounts' });
      if (accounts && accounts.length > 0) {
        account = accounts[0];
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId === CHAIN_ID) {
          publicClient = window.viem.createPublicClient({ chain, transport: window.viem.http(RPC_URL) });
          updateStatus('connected', `✓ ${account.slice(0,6)}...${account.slice(-4)}`);
          setButtonsEnabled(true);
          $('walletBtn').textContent = 'Disconnect';
        } else {
          updateStatus('wrong-network', 'Wrong Network');
          showBanner('⚠️ Please switch to GenLayer Studio Next (chain 61997)', 'warning');
        }
      }
    } catch (err) {}
  }
